<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Sync – Royal AI Fitness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--royal:#1a2f9a;--deep:#0b1646;--mid:#233fb8;--gold:#f6c744;--gold2:#c99a1d;--ivory:#fbf8ee;--ink:#14204f;--muted:#5d6794;--line:#dfe3f5;--green:#27ae7a;--red:#e0524f;--r:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#eef1fc;line-height:1.55}
h1,h2,h3,.cin{font-family:Cinzel,Georgia,serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}

/* nav */
nav.bar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--deep),var(--royal));color:#fff;border-bottom:3px solid var(--gold)}
nav.bar .wrap{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;margin-right:auto}
.logo b{font-family:Cinzel,serif;font-size:1.25rem;letter-spacing:.5px;color:var(--gold)}
.logo small{display:block;font-size:.62rem;color:#b8c3f5;letter-spacing:2px;margin-top:-3px}
.links{display:flex;gap:4px;flex-wrap:wrap}
.links a{color:#d7defa;text-decoration:none;padding:7px 12px;border-radius:99px;font-size:.88rem}
.links a:hover,.links a.on{background:rgba(246,199,68,.18);color:var(--gold)}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(246,199,68,.5);border-radius:99px;padding:5px 12px;font-weight:600;font-size:.88rem;color:var(--gold)}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;font-weight:600;text-decoration:none;font-size:.95rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.gold{background:linear-gradient(180deg,#ffdf7a,var(--gold) 55%,var(--gold2));color:#2a1f00;box-shadow:0 4px 0 #9a7410}
.line{background:transparent;color:#fff;border:2px solid var(--gold)}
.blue{background:var(--royal);color:#fff;box-shadow:0 4px 0 var(--deep)}
.sm{padding:7px 14px;font-size:.82rem}

/* hero slides */
.slides{position:relative;overflow:hidden;background:var(--deep);color:#fff}
.slide{display:none;min-height:430px;padding:46px 0;background:radial-gradient(circle at 80% 30%,var(--mid),var(--deep) 70%)}
.slide.on{display:block;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.slide h1{font-size:clamp(1.9rem,4.6vw,3.1rem);color:#fff}
.slide h1 em{font-style:normal;color:var(--gold)}
.slide p{color:#c7d1fb;max-width:48ch;margin:14px 0 22px}
.slide .art{display:flex;justify-content:center;gap:10px;align-items:flex-end}
.stage{background:radial-gradient(circle,rgba(246,199,68,.25),transparent 65%);padding:10px;border-radius:50%}
.champ-frame{border-radius:26px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.4);width:210px}
.champ-frame img{display:block;width:100%}
.ctrl{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:#51629f;padding:0}
.dot.on{background:var(--gold);width:28px;border-radius:9px}
.arrow{background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.1rem}

/* sections */
.sec{padding:44px 0}
.sec h2{font-size:1.8rem;color:var(--royal)}
.sec .sub{color:var(--muted);margin:6px 0 24px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 6px 18px rgba(26,47,154,.07)}
.card.royal{background:linear-gradient(160deg,var(--royal),var(--deep));color:#fff;border:2px solid var(--gold)}
.card h3{font-size:1.15rem;color:var(--royal);margin-bottom:6px}
.card.royal h3{color:var(--gold)}
.feat .ico{font-size:2rem}
.chars{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.chars .c{text-align:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 18px;width:150px}
.chars .c b{display:block;font-family:Cinzel,serif;color:var(--royal);font-size:.95rem}

/* page head */
.phead{background:linear-gradient(120deg,var(--deep),var(--royal));color:#fff;padding:30px 0;border-bottom:4px solid var(--gold)}
.phead h1{font-size:2rem;color:var(--gold)}
.phead p{margin:6px 0 0;color:#c7d1fb}

/* auth */
.auth{max-width:520px;margin:40px auto;background:#fff;border-radius:24px;border:3px solid var(--gold);overflow:hidden;box-shadow:0 18px 40px rgba(11,22,70,.2)}
.auth .top{background:linear-gradient(120deg,var(--deep),var(--royal));padding:22px;text-align:center;color:#fff}
.auth .top h2{color:var(--gold)}
.auth form{padding:22px;display:grid;gap:12px}
.auth .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:600;font-size:.85rem;display:block}
input,select{width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fafbff;color:var(--ink)}
.err{color:var(--red);font-size:.88rem;min-height:1.2em}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick label{flex:1;min-width:90px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:10px 6px;cursor:pointer}
.pick input{display:none}
.pick input:checked+span{color:var(--royal)}
.pick label:has(input:checked){border-color:var(--gold);background:#fff8dd}

/* dashboard */
.hello{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.av{border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:#d9e0ff;flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.stat{text-align:center}
.stat .n{font-family:Cinzel,serif;font-size:2rem;color:var(--royal)}
.card.royal .stat .n{color:var(--gold)}
.stat small{color:var(--muted)}
.card.royal small{color:#b8c3f5}
.bars{display:flex;gap:10px;align-items:flex-end;height:160px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--muted)}
.bar i{display:block;width:100%;max-width:40px;border-radius:8px 8px 0 0;background:linear-gradient(var(--mid),var(--royal));min-height:4px}
.bar i.today{background:linear-gradient(#ffdf7a,var(--gold2))}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--gold);margin-left:8px}
.tl li{position:relative;padding:8px 0 8px 22px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tl li::before{content:"";position:absolute;left:-9px;top:15px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--royal)}
.tl li.done::before{background:var(--gold);border-color:var(--gold2)}
.tl li.done span{text-decoration:line-through;color:var(--muted)}
.tl time{font-weight:600;color:var(--royal);margin-right:8px}
.progress{height:12px;border-radius:9px;background:#dfe5ff;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.card.royal .progress{background:rgba(255,255,255,.18)}

/* workouts */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:8px 16px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:600;color:var(--royal)}
.chip.on{background:var(--royal);color:var(--gold);border-color:var(--royal)}
.wcard{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(26,47,154,.08);display:flex;flex-direction:column}
.pic{height:130px;display:grid;place-items:center;font-size:3.6rem;position:relative}
.pic em{position:absolute;top:10px;left:10px;font-style:normal;font-size:.72rem;font-weight:600;background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:2px 10px}
.wcard .bd{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.wcard h3{font-size:1.05rem;color:var(--royal)}
.meta{color:var(--muted);font-size:.84rem}
.modal{position:fixed;inset:0;background:rgba(7,14,48,.7);display:none;place-items:center;z-index:100;padding:16px}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;border:3px solid var(--gold)}
.mbox .pic{height:150px}
.mbox .in{padding:20px}
.ex{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex b{color:var(--royal)}
.ex span{background:#fff4cc;color:#7a5a00;padding:2px 12px;border-radius:99px;font-weight:600;font-size:.85rem}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.day.today{border-color:var(--gold);background:#fff8dd}
.day.done{background:#e6f8ee;border-color:var(--green)}
.day b{font-family:Cinzel,serif;color:var(--royal)}
.day .e{font-size:1.8rem;margin:6px 0}
.day select{font-size:.75rem;padding:6px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:6px;background:#dfe5ff}
.heat i.l1{background:#9fb2ff}.heat i.l2{background:var(--gold)}.heat i.today{outline:2px solid var(--royal)}
.flame{font-size:3rem}

/* diet */
.meal{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.meal .ph{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#fff3c4,#ffe08a);display:grid;place-items:center;font-size:2.2rem}
.meal h4{margin:0;font-size:1rem;color:var(--royal)}
.kc{font-weight:600;color:var(--gold2);white-space:nowrap}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;background:#e8ecff;color:var(--royal);font-size:.8rem;font-weight:600}
.tag.g{background:#dff6ea;color:#17744f}.tag.y{background:#fff2c4;color:#7a5a00}.tag.r{background:#fde2e1;color:#a5302d}

/* coach */
.chat{height:380px;overflow:auto;background:#f5f7ff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:.93rem;white-space:pre-line}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--royal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cform{display:flex;gap:8px;margin-top:12px}
.cform input{margin:0}

/* rewards */
.shop{text-align:center}
.shop .stage{display:inline-block;border-radius:50%}
.coin{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3b0,var(--gold) 55%,var(--gold2));color:#7a5a00;font-size:.8em;font-weight:800;border:1px solid var(--gold2);vertical-align:middle}
.badge{opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none}
.badge .ico{font-size:2.4rem}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--deep);color:#fff;border:2px solid var(--gold);padding:11px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:200;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{background:var(--deep);color:#b8c3f5;text-align:center;padding:26px 18px;border-top:4px solid var(--gold);font-size:.88rem}
footer b{color:var(--gold);font-family:Cinzel,serif}

@media(max-width:820px){.slide .wrap{grid-template-columns:1fr;text-align:center}.slide p{margin-left:auto;margin-right:auto}.slide .art{order:-1}.week{grid-template-columns:repeat(2,1fr)}.heat{grid-template-columns:repeat(7,1fr)}.meal{grid-template-columns:56px 1fr}.meal .kc{grid-column:2}.meal .ph{width:56px;height:56px;font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var mem={};
function lsGet(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
function users(){try{return JSON.parse(lsGet("fs_users"))||{}}catch(e){return {}}}
var ME=null;
function persist(){var u=users();u[ME.email]=ME;lsSet("fs_users",JSON.stringify(u))}
function $(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d}

/* ---------- calculations ---------- */
function bmi(h,w){h=h/100;return w/(h*h)}
function bmiCat(b){if(b<18.5)return["Underweight","y"];if(b<25)return["Healthy","g"];if(b<30)return["Overweight","y"];return["Obese range","r"]}
function idealRange(h){h=h/100;return[(18.5*h*h).toFixed(0),(24.9*h*h).toFixed(0)]}
function tdee(u){var bmr=10*u.weight+6.25*u.height-5*u.age+(u.gender==="male"?5:-161);return Math.round(bmr*1.45)}
function target(u){var t=tdee(u);return u.goal==="lose"?t-400:u.goal==="gain"?t+350:t}
var LEVELS=[[0,"Squire"],[100,"Knight"],[300,"Baron"],[700,"Duke"],[1500,"King"]];
function level(total){var l=LEVELS[0],n=null;for(var i=0;i<LEVELS.length;i++){if(total>=LEVELS[i][0]){l=LEVELS[i];n=LEVELS[i+1]||null}}return{name:l[1],from:l[0],next:n}}

 if(!(l&&l.wk.length))i=1;
 for(;i<400;i++){var x=ME.log[dkey(daysAgo(i))];if(x&&x.wk.length)s++;else break}
 return s;
}

 return head("Workout Library","Pick a type, open a sub-type, finish it and collect coins.")+'<div class="sec"><div class="wrap"><div class="chips">'+chips+'</div><div class="grid g3">'+cards+'</div></div></div>';
}

function schedulePage(){
 var names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],wi=(new Date().getDay()+6)%7,st=streak();
 var opts=function(sel){return '<option value="">Rest</option>'+TYPES.map(function(t){return '<optgroup label="'+t.name+'">'+SUBS.filter(function(s){return s.t===t.id}).map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?" selected":"")+'>'+s.name+'</option>'}).join("")+'</optgroup>'}).join("")};
 var days=names.map(function(n,i){
  var s=ME.sched[i]?sub(ME.sched[i]):null,dl=ME.log[dkey()];
  var done=i===wi&&dl&&s&&dl.wk.indexOf(s.id)>-1;
  return '<div class="day'+(i===wi?" today":"")+(done?" done":"")+'"><b>'+n+'</b><div class="e">'+(s?s.e:"😴")+'</div><select aria-label="'+n+' workout" onchange="App.setSched('+i+',this.value)">'+opts(ME.sched[i])+'</select>'+(i===wi?'<div class="meta">Today</div>':'')+'</div>';
 }).join("");
 var heat="";
 for(var i=27;i>=0;i--){var x=ME.log[dkey(daysAgo(i))];var c=x&&x.wk.length?(x.wk.length>1?"l2":"l1"):"";heat+='<i class="'+c+(i===0?" today":"")+'" title="'+dkey(daysAgo(i))+'"></i>'}
 return head("Workout Schedule & Streak","Plan your week. Train daily to keep the flame alive.")+'<div class="sec"><div class="wrap"><div class="grid g2"><div class="card royal stat"><div class="flame">🔥</div><div class="n">'+st+' day'+(st===1?"":"s")+'</div><small>Current streak. Every 3rd day gives +30 bonus coins.</small></div><div class="card"><h3>Last 28 days</h3><div class="heat">'+heat+'</div><div class="meta" style="margin-top:8px">Light blue: 1 workout · Gold: 2 or more</div></div></div><div class="card" style="margin-top:18px"><h3>My week</h3><div class="week" style="margin-top:12px">'+days+'</div></div></div></div>';
}

function dietPage(){
 var t=target(ME),wd=(new Date().getDay()+6)%7,pref=D[ME.food],c=bmiCat(bmi(ME.height,ME.weight)),sum=0;
 var rows=["b","l","s","d"].map(function(k){
  var o=pref[k][wd],kc=Math.round(t*SHARE[k]),por=(kc/o[1]).toFixed(1);sum+=kc;
  var done=dayLog().done[k];
  return '<div class="meal"><div class="ph">'+o[2]+'</div><div><h4>'+MEALNAME[k]+' · '+MEALTIME[k]+'</h4><div>'+o[0]+'</div><div class="meta">Portion x'+por+' of a regular serving</div></div><div style="text-align:right"><div class="kc">'+kc+' kcal</div><button class="btn '+(done?"line":"blue")+' sm" style="margin-top:6px;'+(done?"color:var(--royal);border-color:var(--line)":"")+'" onclick="App.tick(\''+k+'\',5,\''+MEALNAME[k]+' eaten\');App.go(\'diet\')">'+(done?"Eaten":"I ate this")+'</button></div></div>';
 }).join("");
 var tips={lose:["Eat slowly and stop at 80% full.","Choose chapati or millet over extra rice.","Swap sweets and soft drinks for fruit and buttermilk.","Aim for 8 glasses of water."],gain:["Add a handful of nuts or a banana shake daily.","Eat every 3 to 4 hours.","Include protein in every meal: dal, paneer, egg, chicken or fish.","Sleep 8 hours for muscle recovery."],keep:["Keep meals regular and balanced.","Half the plate vegetables, quarter protein, quarter carbs.","Limit fried snacks to once a week.","Stay active daily."]};
 var avoid=c[0]==="Underweight"?"Do not skip meals. Add healthy calories like nuts, banana and ghee.":c[0]==="Healthy"?"Your BMI is healthy. Keep the balance.":"Cut down on fried food, sugary drinks and late-night snacks.";
 return head("Your Diet Plan","Indian meals matched to your goal, food choice and body.")+'<div class="sec"><div class="wrap"><div class="grid g2"><div class="card"><h3>Today\'s meals</h3>'+rows+'<div class="kc" style="text-align:right;margin-top:10px">Total about '+sum+' kcal</div></div><div><div class="card royal"><h3>Plan summary</h3><p>Goal: <b>'+({lose:"Lose weight",keep:"Stay fit",gain:"Build muscle"})[ME.goal]+'</b><br>Food choice: <b>'+({veg:"Vegetarian",egg:"Eggetarian",non:"Non-vegetarian"})[ME.food]+'</b><br>Daily target: <b>'+t+' kcal</b><br>BMI: <b>'+bmi(ME.height,ME.weight).toFixed(1)+'</b> ('+c[0]+')</p><small>'+avoid+'</small></div><div class="card" style="margin-top:18px"><h3>Tips for you</h3><ul style="padding-left:18px;margin:0">'+tips[ME.goal].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div><div class="card" style="margin-top:18px"><h3>Change plan</h3><label>Food choice<select onchange="App.setProfile(\'food\',this.value)"><option value="veg"'+(ME.food==="veg"?" selected":"")+'>Vegetarian</option><option value="egg"'+(ME.food==="egg"?" selected":"")+'>Eggetarian</option><option value="non"'+(ME.food==="non"?" selected":"")+'>Non-vegetarian</option></select></label><br><label>Goal<select onchange="App.setProfile(\'goal\',this.value)"><option value="lose"'+(ME.goal==="lose"?" selected":"")+'>Lose weight</option><option value="keep"'+(ME.goal==="keep"?" selected":"")+'>Stay fit</option><option value="gain"'+(ME.goal==="gain"?" selected":"")+'>Build muscle</option></select></label></div></div></div></div></div>';
}

function coachPage(){
 if(!chatLog.length)chatLog.push(["bot","Namaste "+ME.name.split(" ")[0]+"! I am your AI coach. I know your BMI, goal and streak. What do you need?"]);
 var chips=["Plan my day","What should I eat?","I feel lazy","Weight loss tips","Muscle gain tips","My progress"].map(function(c){return '<button class="chip" onclick="App.ask(\''+c+'\')">'+c+'</button>'}).join("");
 return head("AI Coach","Ask about workouts, food, motivation or progress.")+'<div class="sec"><div class="wrap"><div class="grid g2" style="grid-template-columns:200px 1fr;align-items:start"><div class="card royal" style="text-align:center">'+avatar(ME.char,120,'margin:0 auto')+'<h3 style="margin-top:10px">'+CH[ME.char].name+'</h3><small>Your AI coach</small></div><div class="card"><div class="chat" id="chat">'+chatHtml()+'</div><div class="chips" style="margin:12px 0 0">'+chips+'</div><form class="cform" onsubmit="return App.send(event)"><input id="cIn" placeholder="Type your question..." autocomplete="off"><button class="btn gold" type="submit">Send</button></form></div></div></div></div>';
}
function chatHtml(){return chatLog.map(function(m){return '<div class="msg '+m[0]+'">'+esc(m[1])+'</div>'}).join("")}
function coachReply(q){
 q=q.toLowerCase();var st=streak(),b=bmi(ME.height,ME.weight),c=bmiCat(b),wi=(new Date().getDay()+6)%7,s=ME.sched[wi]?sub(ME.sched[wi]):null,dl=dayLog();
 if(/plan|today|schedule/.test(q))return s?"Today is "+s.name+" ("+s.m+" min). Start with 5 minutes of warm-up, finish the "+s.ex.length+" exercises, then stretch. Drink water before you begin. You have done "+dl.water+"/8 glasses so far.":"Today is a rest day in your schedule. Do a 20 minute walk and some stretching. Recovery builds strength.";
 if(/eat|food|diet|meal|hungry/.test(q))return "Based on your goal and "+({veg:"vegetarian",egg:"egg",non:"non-veg"})[ME.food]+" choice, your target is about "+target(ME)+" kcal. Open the Diet page to see today's meals. Quick rule: protein in every meal, fruits as snacks, less fried food.";
 if(/lazy|tired|motivat|bore|skip|sad/.test(q))return "Even kings have slow days. Do just 10 minutes: try the Study-Desk Break or Morning Stretch. Starting is the hardest part, and you will keep your "+st+"-day streak alive. Finish and I will give you coins!";
 if(/lose|fat|weight loss|slim|belly/.test(q))return "For fat loss: 1) 30 to 40 minutes cardio or HIIT, 4 days a week. 2) Eat about 300 to 400 kcal below your need. 3) 8 glasses of water and 7 hours sleep. 4) Walk 8,000 steps daily. Be patient: 0.5 kg a week is healthy.";
 if(/muscle|gain|bulk|strong|protein/.test(q))return "For muscle: train each body part twice a week with progressive overload, eat 1.6 g protein per kg body weight (dal, paneer, egg, chicken, fish), eat 300 kcal above your need and sleep 8 hours.";
 if(/bmi|body/.test(q))return "Your BMI is "+b.toFixed(1)+" ("+c[0]+"). Healthy weight for your height is "+idealRange(ME.height).join(" to ")+" kg.";
 if(/progress|streak|coin|level/.test(q))return "Streak: "+st+" days. Coins: "+ME.coins+". Workouts done: "+totalWorkouts()+". Level: "+level(ME.total).name+". Keep going!";
 if(/water|drink|hydrat/.test(q))return "Aim for 8 glasses a day. You have had "+dl.water+" today. Each glass logged gives +2 coins.";
 if(/sleep|rest/.test(q))return "Sleep 7 to 8 hours. Muscles grow and the brain stores what you studied while you sleep. Tick the Sleep slot on your dashboard for +10 coins.";
 if(/hi|hello|hey|namaste/.test(q))return "Hello champion! Ask me for a plan, food ideas or motivation.";
 return "I can help with: your day plan, what to eat, motivation, weight loss, muscle gain, BMI, water, sleep and progress. Tap a chip below or ask in your own words.";
}
function typeOut(q){chatLog.push(["me",q]);chatLog.push(["bot",coachReply(q)]);var c=$("chat");if(c){c.innerHTML=chatHtml();c.scrollTop=c.scrollHeight}}

function rewardsPage(){
 var ch=Object.keys(CH).map(function(k){
  var own=ME.owned.indexOf(k)>-1,sel=ME.char===k;
  return '<div class="card shop"><div class="stage">'+avatar(k,110)+'</div><h3 style="margin-top:8px">'+CH[k].name+'</h3><div class="meta">'+CH[k].tag+'</div>'+(own?'<button class="btn '+(sel?"gold":"blue")+' sm" style="margin-top:10px" onclick="App.useChar(\''+k+'\')">'+(sel?"Selected":"Use hero")+'</button>':'<button class="btn gold sm" style="margin-top:10px" onclick="App.buy(\''+k+'\')"><span class="coin">₹</span> '+CH[k].cost+' Unlock</button>')+'</div>';
 }).join("");
 var st=streak(),tw=totalWorkouts();
 var B=[["🥇","First workout",tw>=1],["🔥","3-day streak",st>=3],["⚡","7-day streak",st>=7],["💪","10 workouts",tw>=10],["💧","8 glasses in a day",dayLog().water>=8],["🪙","200 coins earned",ME.total>=200],["👑","Reach Duke",ME.total>=700],["🦸","All heroes",ME.owned.length===Object.keys(CH).length]];
 var earn=[["Finish a workout","15 to 30 coins"],["Every 3-day streak","+30 bonus"],["Each water glass","+2 coins"],["Meal eaten on time","+5 coins"],["Good sleep logged","+10 coins"],["Wake-up and rest-day habits","+5 coins"]];
 return head("Royal Rewards","Fitness and health habits both earn gold coins.")+'<div class="sec"><div class="wrap"><div class="grid g2"><div class="card royal stat"><div class="n"><span class="coin">₹</span> '+ME.coins+'</div><small>Available coins · '+ME.total+' earned in total</small></div><div class="card"><h3>How to earn</h3>'+earn.map(function(e){return '<div class="ex"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>'}).join("")+'</div></div><h2 style="margin:30px 0 14px">Hero shop</h2><div class="grid g4">'+ch+'</div><h2 style="margin:30px 0 14px">Badges</h2><div class="grid g4">'+B.map(function(b){return '<div class="card stat badge'+(b[2]?" on":"")+'"><div class="ico">'+b[0]+'</div><b>'+b[1]+'</b></div>'}).join("")+'</div></div></div>';
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- nav & router ---------- */
function navHtml(){
 var L=ME?[["dashboard","Home"],["workouts","Workouts"],["schedule","Schedule"],["diet","Diet"],["coach","AI Coach"],["bmi","BMI"],["rewards","Rewards"]]:[["home","Home"],["workouts","Workouts"],["bmi","BMI"]];
 var links=L.map(function(l){return '<a href="#/'+l[0]+'" class="'+(page===l[0]?"on":"")+'">'+l[1]+'</a>'}).join("");
 var right=ME?'<span class="pill" id="coinPill"><span class="coin">₹</span> '+ME.coins+'</span>'+'<button class="btn line sm" onclick="App.logout()">Logout</button>':'<a class="btn line sm" href="#/login">Login</a><a class="btn gold sm" href="#/register">Register</a>';
 return '<nav class="bar"><div class="wrap"><a class="logo" href="#/'+(ME?"dashboard":"home")+'">'+logoSvg(44)+'<div><b>FITNESS SYNC</b><small>MOVE · EAT · SYNC</small></div></a><div class="links">'+links+'</div>'+right+'</div></nav>';
}
var GUEST=["home","login","register","bmi","workouts"];
function route(){
 var p=(location.hash.replace(/^#\/?/,"")||"home").split("?")[0];var prev=page,y=window.pageYOffset;
 if(!ME&&GUEST.indexOf(p)<0)p="login";
 if(ME&&(p==="home"||p==="login"||p==="register"))p="dashboard";
 page=p;
 clearInterval(slideTimer);
 var map={home:homePage,login:loginPage,register:registerPage,bmi:bmiPage,workouts:workoutsPage,dashboard:function(){return dashPage()},schedule:function(){return schedulePage()},diet:function(){return dietPage()},coach:function(){return coachPage()},rewards:function(){return rewardsPage()}};
 var fn=map[p]||homePage;
 $("nav").innerHTML=navHtml();
 $("app").innerHTML=fn();
 window.scrollTo(0,p===prev?y:0);
 if(p==="home")slideTimer=setInterval(function(){App.slide(slideDelta(1))},5500);
 if(p==="coach"){var c=$("chat");if(c)c.scrollTop=c.scrollHeight}
}

/* ---------- actions ---------- */
function openModal(h){$("mbox").innerHTML=h;$("modal").className="modal on"}
window.App={
 go:function(p){if(location.hash==="#/"+p)route();else location.hash="#/"+p},
 slide:function(i){slideIdx=i;var s=document.querySelectorAll(".slide"),d=document.querySelectorAll(".dot");for(var k=0;k<s.length;k++){s[k].className="slide"+(k===i?" on":"");d[k].className="dot"+(k===i?" on":"")}},
 msg:toast,
 login:function(e){
  e.preventDefault();var u=users()[$("lEmail").value.trim().toLowerCase()];
  if(!u||u.pass!==btoa(unescape(encodeURIComponent($("lPass").value)))){$("lErr").textContent="Email or password is wrong.";return false}
  ME=u;lsSet("fs_sess",u.email);App.go("dashboard");return false;
 },
 register:function(e){
  e.preventDefault();var em=$("rEmail").value.trim().toLowerCase(),all=users();
  if(all[em]){$("rErr").textContent="This email is already registered. Please login.";return false}
  var g=$("rGoal").value;
  ME={email:em,name:$("rName").value.trim(),pass:btoa(unescape(encodeURIComponent($("rPass").value))),age:+$("rAge").value,gender:$("rGen").value,height:+$("rH").value,weight:+$("rW").value,goal:g,food:$("rFood").value,char:"champ",owned:["champ"],coins:50,total:50,log:{},sched:PRESET[g].slice()};
  persist();lsSet("fs_sess",em);App.go("dashboard");setTimeout(function(){toast("Welcome! +50 coins")},300);return false;
 },
 logout:function(){ME=null;lsDel("fs_sess");App.go("home")},
 water:function(){var d=dayLog();if(d.water>=8){toast("8 glasses done. Great hydration!");return}d.water++;persist();addCoins(2,"Water glass "+d.water+"/8");route()},
 tick:function(k,c,m){var d=dayLog();if(d.done[k]){toast("Already done today");return}d.done[k]=true;persist();addCoins(c,m);route()},
 filter:function(t){activeType=t;route()},
 openSub:function(id){
  var s=sub(id),t=type(s.t),done=ME&&dayLog().wk.indexOf(id)>-1;
  var days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  openModal('<div class="pic" style="background:'+t.g+'"><em>'+t.name+'</em><span style="font-size:4.4rem">'+s.e+'</span></div><div class="in"><h2 class="cin" style="color:var(--royal)">'+s.name+'</h2><div class="meta">⏱ '+s.m+' min · '+s.lvl+'</div><div style="margin:12px 0">'+s.ex.map(function(x){return '<div class="ex"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div>'+(ME?'<button class="btn gold" onclick="App.finish(\''+id+'\')">'+(done?"Done today":"Finish workout")+'</button> <button class="btn line" style="color:var(--royal);border-color:var(--line)" onclick="App.closeModal()">Close</button><div class="meta" style="margin-top:10px">Add to my week: '+days.map(function(d,i){return '<button class="chip" style="padding:3px 10px;margin:2px" onclick="App.setSched('+i+',\''+id+'\',true)">'+d+'</button>'}).join("")+'</div>':'<a class="btn gold" href="#/register" onclick="App.closeModal()">Register to track and earn coins</a>')+'</div>');
 },
 closeModal:function(){$("modal").className="modal"},
 finish:function(id){
  var s=sub(id),d=dayLog();
  if(d.wk.indexOf(id)>-1){toast("Already finished today. Pick another workout!");return}
  var before=streak();d.wk.push(id);d.min+=s.m;persist();
  var c=15+Math.round(s.m/3);addCoins(c,s.name+" complete");
  var after=streak();if(after>before&&after%3===0){setTimeout(function(){addCoins(30,after+"-day streak bonus!");route()},900)}
  App.closeModal();route();
 },
 setSched:function(i,v,fromModal){ME.sched[i]=v||null;persist();if(fromModal){toast("Added to "+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]);}else route()},
 setProfile:function(k,v){ME[k]=v;persist();route()},
 bmiLive:function(){var h=+$("bh").value,w=+$("bw").value;if(h>0&&w>0)$("bmiOut").innerHTML=bmiCard(h,w)},
 saveBmi:function(){ME.height=+$("bh").value;ME.weight=+$("bw").value;persist();toast("Profile updated")},
 ask:function(q){typeOut(q)},
 send:function(e){e.preventDefault();var i=$("cIn"),v=i.value.trim();if(v){typeOut(v);i.value=""}return false},
 buy:function(k){if(ME.coins<CH[k].cost){toast("Need "+(CH[k].cost-ME.coins)+" more coins. Keep training!");return}ME.coins-=CH[k].cost;ME.owned.push(k);persist();toast("Unlocked "+CH[k].name+"!");route()},
 useChar:function(k){ME.char=k;persist();route()}
};

window.addEventListener("hashchange",route);
var sess=lsGet("fs_sess");if(sess){var u=users()[sess];if(u)ME=u}
route();
})();
</script>
</body>
</html>
